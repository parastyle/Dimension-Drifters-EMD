# §26 retro #7: quality gates in CI, non-bypassable. typecheck + lint + gen:check + test + build.
# schema-validate (retro #3) is added here when SPEC-01 lands the weapon schema.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # H15: fail the build if a committed *.generated.ts drifted from its source data (edited the concepts,
      # forgot to re-run codegen). Plain `node` — the gated generators use only built-ins, no artkit install.
      - run: pnpm gen:check
      - run: pnpm test
      - run: pnpm build
