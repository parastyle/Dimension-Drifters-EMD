<title>Dimension Drifters — Sky Carrier belt-scroll experiment</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #0b1622; overflow: hidden; }
  #stage {
    position: fixed; inset: 0; width: 100%; height: 100%;
    display: block; touch-action: none; cursor: crosshair;
    image-rendering: auto;
  }
  /* ── chrome: a thin HUD frame that reads on the bright sky, arcade-cabinet flavor ── */
  .hud {
    position: fixed; left: 0; right: 0; pointer-events: none;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    color: #eaf2ff; text-shadow: 0 1px 2px rgba(4,12,24,.85), 0 0 1px rgba(4,12,24,.9);
  }
  .hud.top { top: 0; padding: 14px 18px; display: flex; align-items: baseline; gap: 14px; }
  .title {
    font-weight: 800; letter-spacing: .16em; text-transform: uppercase; font-size: 15px;
    color: #ffd24a; text-shadow: 0 2px 0 #b3480f, 0 3px 6px rgba(4,12,24,.7);
  }
  .sub { font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #9fd0ff; opacity: .9; }
  .hud.bottom { bottom: 0; padding: 12px 18px; display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 11px; letter-spacing: .04em; }
  .keys b {
    display: inline-block; min-width: 20px; text-align: center; padding: 2px 6px; margin-right: 5px;
    background: rgba(10,22,38,.66); border: 1px solid rgba(159,208,255,.5); border-radius: 5px;
    color: #eaf2ff; font-weight: 700;
  }
  .readout { font-size: 11px; letter-spacing: .06em; color: #bfe0ff; font-variant-numeric: tabular-nums; text-align: right; line-height: 1.5; }
  .readout .lab { color: #7fb0dd; }
  .badge {
    pointer-events: none; position: fixed; top: 14px; right: 18px;
    font-family: ui-monospace, monospace; font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
    color: #0b1622; background: #ffd24a; padding: 4px 9px; border-radius: 999px; font-weight: 800;
    box-shadow: 0 2px 8px rgba(4,12,24,.5);
  }
</style>

<canvas id="stage"></canvas>
<div class="hud top">
  <span class="title">Sky Carrier</span>
  <span class="sub">belt-scroll · parallax · depth-band experiment</span>
</div>
<div class="badge">Stage 0 · look test</div>
<div class="hud bottom">
  <div class="keys">
    <span><b>A</b><b>D</b> / <b>&larr;</b><b>&rarr;</b> walk the belt</span>
    <span><b>W</b><b>S</b> / <b>&uarr;</b><b>&darr;</b> step into depth</span>
    <span><b>Space</b> jump</span>
    <span><b>Shift</b> dash</span>
  </div>
  <div class="readout" id="readout"></div>
</div>

<script>
(() => {
  "use strict";
  const cv = document.getElementById("stage");
  const ctx = cv.getContext("2d", { alpha: false });
  const readout = document.getElementById("readout");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  // ── Virtual render space (research: 640x360 internal, integer-scales to 4K). We render into a
  //    fixed virtual canvas and letterbox-scale it to the display so the belt feel is aspect-stable.
  const VW = 640, VH = 360;
  // Walkable floor band (the shallow ¾-view strip). Depth z:0(far)..ZMAX(near) maps into it.
  const HORIZON = 214;         // screen row of the FAR edge of the belt
  const FRONT = 330;           // screen row of the NEAR edge
  const ZMAX = 232;            // world depth units across the band
  const DEPTHSCALE = (FRONT - HORIZON) / ZMAX; // ≈0.5 foreshortening
  const LEVEL_W = 640 * 7;     // ~7 viewports of level to roam

  let dpr = 1, scale = 1, offX = 0, offY = 0; // display fit
  function resize() {
    const w = innerWidth, h = innerHeight;
    dpr = Math.min(devicePixelRatio || 1, 2);
    cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
    cv.style.width = w + "px"; cv.style.height = h + "px";
    scale = Math.min(w / VW, h / VH);          // contain (letterbox) — keeps gameplay view fair
    offX = (w - VW * scale) / 2; offY = (h - VH * scale) / 2;
  }
  addEventListener("resize", resize); resize();

  // ── Input ──────────────────────────────────────────────────────────────────────
  const keys = new Set();
  const DOWN = e => {
    const k = e.key.toLowerCase();
    keys.add(k);
    if ([" ","arrowup","arrowdown","arrowleft","arrowright"].includes(k)) e.preventDefault();
  };
  addEventListener("keydown", DOWN, { passive: false });
  addEventListener("keyup", e => keys.delete(e.key.toLowerCase()));
  const held = (...ks) => ks.some(k => keys.has(k));

  // ── Actors ──────────────────────────────────────────────────────────────────────
  // Floor world-space: x along the belt, z depth into the band, height above floor.
  function makeActor(x, z, tint, dark) {
    return { x, z, h: 0, vh: 0, face: 1, tint, dark, bob: Math.random()*6, step: 0 };
  }
  const player = makeActor(320, ZMAX*0.55, "#ff7a3c", "#7a2b0e");
  player.hero = true;
  // A few drifters/enemies patrolling to show y-sort + depth reads.
  const crowd = [
    makeActor(760, 60, "#5ec8ff", "#123b57"),
    makeActor(980, 175, "#b98cff", "#3a2160"),
    makeActor(1180, 110, "#7be08a", "#1c4a28"),
    makeActor(1760, 150, "#5ec8ff", "#123b57"),
    makeActor(2040, 70, "#ffd24a", "#7a5410"),
    makeActor(2600, 130, "#b98cff", "#3a2160"),
  ];
  crowd.forEach(c => { c.homeX = c.x; c.dir = Math.random()<.5?-1:1; c.spd = 22+Math.random()*18; });

  let camX = 0, t = 0;

  // ── Procedural cloud sprite (cached once, blitted with wrap + drift) ──────────────
  function cloudSprite(w, h, tint) {
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    const g = c.getContext("2d");
    const puffs = 10 + (w>180?6:0);
    for (let i=0;i<puffs;i++){
      const px = w*0.12 + Math.random()*w*0.76;
      const py = h*0.45 + (Math.random()-0.5)*h*0.5;
      const r = h*(0.28 + Math.random()*0.34);
      const rg = g.createRadialGradient(px, py-r*0.2, r*0.2, px, py, r);
      rg.addColorStop(0, tint); rg.addColorStop(1, "rgba(255,255,255,0)");
      g.fillStyle = rg; g.beginPath(); g.arc(px, py, r, 0, 7); g.fill();
    }
    return c;
  }
  const cloudFar = cloudSprite(220, 84, "rgba(233,244,255,0.72)");
  const cloudMid = cloudSprite(300, 120, "rgba(255,255,255,0.92)");
  function cloudBand(sprite, count, yTop, yRange, scroll, drift, sc) {
    const arr = [];
    for (let i=0;i<count;i++) arr.push({ x: Math.random()*LEVEL_W*scroll*1.6 + i*260, y: yTop+Math.random()*yRange, s: sc*(0.7+Math.random()*0.6) });
    return { sprite, arr, scroll, drift };
  }
  const clouds = [
    cloudBand(cloudFar, 10, 26, 60, 0.08, 5, 0.9),
    cloudBand(cloudMid, 8, 60, 70, 0.16, 9, 1.15),
  ];

  // ── Carrier island (mid-layer painted superstructure), cached ─────────────────────
  function islandSprite() {
    const w=260,h=200,c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");
    const steel=(x,y,ww,hh,top,bot)=>{const lg=g.createLinearGradient(0,y,0,y+hh);lg.addColorStop(0,top);lg.addColorStop(1,bot);g.fillStyle=lg;g.fillRect(x,y,ww,hh);};
    steel(40,70,150,130,"#5b6b7d","#39434f");            // island base
    steel(70,30,84,60,"#6b7d90","#434f5c");              // bridge tower
    g.fillStyle="#8fd0ff";for(let i=0;i<3;i++)for(let j=0;j<4;j++){g.fillRect(78+j*18,40+i*15,12,9);} // lit windows
    steel(150,84,44,116,"#6b7d90","#434f5c");            // funnel block
    g.fillStyle="#2c3640";g.fillRect(104,6,5,26);g.fillRect(120,0,4,32); // antennas
    g.strokeStyle="#243947";g.lineWidth=2;g.beginPath();g.moveTo(122,2);g.lineTo(150,26);g.stroke();
    g.fillStyle="#ffd24a";g.fillRect(103,4,7,4);         // beacon
    return c;
  }
  const island = islandSprite();

  // ── Draw one drifter (feet-anchored ¾ figure) at a screen point ───────────────────
  function drawActor(a) {
    const sx = a.x - camX;
    const floorY = HORIZON + a.z * DEPTHSCALE;
    const sy = floorY - a.h;
    const depthT = a.z / ZMAX;                 // 0 far .. 1 near
    const s = 0.82 + depthT * 0.30;            // subtle foreshorten: nearer = a hair larger
    // shadow on the FLOOR (ignores jump height) — sells depth + the jump gap
    const shR = 13 * s * (1 - a.h/260);
    ctx.fillStyle = "rgba(6,14,24,0.34)";
    ctx.beginPath(); ctx.ellipse(sx, floorY, shR, shR*0.42, 0, 0, 7); ctx.fill();
    // body
    const bob = reduce ? 0 : Math.sin(a.bob) * 1.1;
    const H = 42 * s, W = 15 * s;
    const bx = sx, by = sy + bob;
    ctx.save(); ctx.translate(bx, by);
    // legs (stride)
    const stride = Math.sin(a.step) * 5 * s;
    ctx.strokeStyle = a.dark; ctx.lineWidth = 4*s; ctx.lineCap="round";
    ctx.beginPath(); ctx.moveTo(-2*s,-2); ctx.lineTo(-2*s+stride,10*s); ctx.moveTo(2*s,-2); ctx.lineTo(2*s-stride,10*s); ctx.stroke();
    // coat/torso
    ctx.fillStyle = a.tint;
    ctx.beginPath();
    ctx.moveTo(-W*0.5,-2); ctx.lineTo(W*0.5,-2); ctx.lineTo(W*0.42,-H*0.62); ctx.lineTo(-W*0.42,-H*0.62); ctx.closePath(); ctx.fill();
    ctx.fillStyle = a.dark; ctx.fillRect(-W*0.5,-4,W,3*s); // belt
    // head
    ctx.fillStyle = "#f0d8c4"; ctx.beginPath(); ctx.arc(0,-H*0.74, 5.4*s, 0, 7); ctx.fill();
    ctx.fillStyle = a.dark; ctx.beginPath(); ctx.arc(0,-H*0.80, 5.8*s, Math.PI*1.05, Math.PI*2.0); ctx.fill(); // hat
    // facing pip (a shoulder highlight toward travel)
    ctx.fillStyle = "rgba(255,255,255,0.5)"; ctx.fillRect(a.face>0?W*0.18:-W*0.30,-H*0.5,W*0.12,H*0.34);
    if (a.hero) { ctx.strokeStyle="rgba(255,210,74,0.9)"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(0,-H*0.74,7.4*s,0,7); ctx.stroke(); }
    ctx.restore();
  }

  // ── Frame ─────────────────────────────────────────────────────────────────────
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last)/1000); last = now; t += dt;

    // player control (belt x + depth z + jump h)
    const sp = held("shift") ? 260 : 165;
    let mx = (held("d","arrowright")?1:0) - (held("a","arrowleft")?1:0);
    let mz = (held("s","arrowdown")?1:0) - (held("w","arrowup")?1:0);
    if (mx||mz){ const l=Math.hypot(mx,mz)||1; mx/=l; mz/=l; }
    player.x += mx*sp*dt; player.z += mz*sp*dt;
    player.x = Math.max(40, Math.min(LEVEL_W-40, player.x));
    player.z = Math.max(8, Math.min(ZMAX, player.z));
    if (mx) player.face = mx>0?1:-1;
    if ((mx||mz)) { player.step += dt* (sp/22); player.bob += dt*10; } else { player.step*=0.85; }
    // jump
    if (held(" ") && player.h===0 && player.vh===0) player.vh = 250;
    if (player.h>0 || player.vh!==0){ player.h += player.vh*dt; player.vh -= 900*dt; if (player.h<=0){player.h=0;player.vh=0;} }

    // crowd patrol
    for (const c of crowd){ c.x += c.dir*c.spd*dt; c.face=c.dir; if (Math.abs(c.x-c.homeX)>140){c.dir*=-1;} c.step+=dt*7; c.bob+=dt*8; }

    // belt camera: eased horizontal follow, clamped to level bounds (vertical locked)
    const want = Math.max(0, Math.min(LEVEL_W - VW, player.x - VW*0.42));
    camX += (want - camX) * (1 - Math.exp(-dt/0.12));

    // ── render into virtual space ──
    ctx.save();
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.fillStyle="#0b1622"; ctx.fillRect(0,0,cv.width/dpr,cv.height/dpr); // letterbox bars
    ctx.translate(offX, offY); ctx.scale(scale, scale);
    ctx.beginPath(); ctx.rect(0,0,VW,VH); ctx.clip();

    // 1. sky gradient (static)
    const sky = ctx.createLinearGradient(0,0,0,FRONT);
    sky.addColorStop(0,"#2f7fc4"); sky.addColorStop(0.55,"#7cc0ec"); sky.addColorStop(1,"#cfeaf7");
    ctx.fillStyle=sky; ctx.fillRect(0,0,VW,HORIZON+4);
    // sun glow
    const sun=ctx.createRadialGradient(VW*0.78,58,8,VW*0.78,58,150);
    sun.addColorStop(0,"rgba(255,246,214,0.9)");sun.addColorStop(1,"rgba(255,246,214,0)");
    ctx.fillStyle=sun; ctx.fillRect(0,0,VW,HORIZON);

    // 2. far ocean/horizon haze far below (sells altitude — very slow, opposite drift)
    ctx.fillStyle="rgba(180,214,232,0.5)";
    for(let i=0;i<3;i++){const y=150+i*8; ctx.globalAlpha=0.18-i*0.04; ctx.fillRect(0,y,VW,3);} ctx.globalAlpha=1;

    // 3. drifting cloud bands (camera-independent drift + parallax scroll)
    for (const band of clouds){
      const drift = reduce ? 0 : t*band.drift;
      for (const cl of band.arr){
        let sx = ((cl.x - camX*band.scroll - drift) % (VW+band.sprite.width)) ;
        if (sx < -band.sprite.width) sx += VW+band.sprite.width;
        const w=band.sprite.width*cl.s, h=band.sprite.height*cl.s;
        ctx.drawImage(band.sprite, sx-band.sprite.width, cl.y, w, h);
        ctx.drawImage(band.sprite, sx-band.sprite.width - (VW+band.sprite.width), cl.y, w, h);
      }
    }

    // 4. carrier island (mid parallax 0.4), a couple placed down the deck
    for (const ix of [900, 3200, 5200]){
      const sx = ix - camX*0.4; if (sx>-260 && sx<VW+40) ctx.drawImage(island, sx, HORIZON-150, 200, 154);
    }

    // 5. the DECK band (floor, scrollFactor 1.0) — painted-perspective steel plating + markings
    // back wall
    const wall = ctx.createLinearGradient(0,HORIZON-16,0,HORIZON+6);
    wall.addColorStop(0,"#59677a"); wall.addColorStop(1,"#3c4653");
    ctx.fillStyle=wall; ctx.fillRect(0,HORIZON-16,VW,22);
    // deck gradient
    const deck = ctx.createLinearGradient(0,HORIZON,0,FRONT+12);
    deck.addColorStop(0,"#41474d"); deck.addColorStop(1,"#5a6169");
    ctx.fillStyle=deck; ctx.fillRect(0,HORIZON+2,VW,FRONT-HORIZON+16);
    // plating seams converging toward the horizon (perspective), scroll with camera
    ctx.strokeStyle="rgba(20,26,32,0.5)"; ctx.lineWidth=1;
    const seam0 = -(camX % 96);
    for (let x=seam0; x<VW+96; x+=96){
      ctx.beginPath();
      ctx.moveTo(x + (x-VW/2)*0.06, HORIZON+2);   // near-converge at the back
      ctx.lineTo(x, FRONT+12);
      ctx.stroke();
    }
    // depth stripe lines (help you read z)
    for (let i=1;i<4;i++){ const y=HORIZON + (ZMAX*i/4)*DEPTHSCALE; ctx.strokeStyle="rgba(20,26,32,0.16)"; ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(VW,y); ctx.stroke(); }
    // centreline warning chevrons (deck markings), scroll with camera
    ctx.fillStyle="rgba(255,210,74,0.8)";
    const chY = HORIZON + ZMAX*0.5*DEPTHSCALE;
    for (let x = -(camX % 120); x<VW+40; x+=120){ ctx.beginPath(); ctx.moveTo(x,chY-6); ctx.lineTo(x+22,chY); ctx.lineTo(x,chY+6); ctx.closePath(); ctx.fill(); }
    // near safety lip
    ctx.fillStyle="#2b3138"; ctx.fillRect(0,FRONT+8,VW,VH-FRONT);
    ctx.fillStyle="#ffd24a"; for(let x=-(camX%40); x<VW; x+=40){ ctx.fillRect(x,FRONT+8,20,4); }

    // 6. actors — y-sort by z ASC so nearer (bigger z) draws LAST/in front
    const actors = [player, ...crowd].sort((a,b)=> a.z - b.z);
    for (const a of actors) drawActor(a);

    // 7. foreground occluder railing (scrollFactor 1.2) — passes in FRONT, boosts depth
    ctx.strokeStyle="rgba(24,30,38,0.9)"; ctx.lineWidth=3;
    const fx = -(camX*1.2 % 130);
    for (let x=fx; x<VW+130; x+=130){
      ctx.beginPath(); ctx.moveTo(x, FRONT-2); ctx.lineTo(x, VH-6); ctx.stroke();
    }
    ctx.beginPath(); ctx.moveTo(0,FRONT+2); ctx.lineTo(VW,FRONT+2); ctx.lineWidth=3; ctx.stroke();

    ctx.restore();

    readout.innerHTML =
      `<span class="lab">x</span> ${player.x|0} &nbsp; <span class="lab">z</span> ${player.z|0}/${ZMAX} &nbsp; <span class="lab">cam</span> ${camX|0} &nbsp; <span class="lab">depthScale</span> ${DEPTHSCALE.toFixed(2)}`;

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
