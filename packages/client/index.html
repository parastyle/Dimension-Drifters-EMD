<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dimension Drifters — Netcode POC</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1320;
        font-family: system-ui, sans-serif;
      }
      /* Full-viewport host for the Phaser canvas. RESIZE mode measures THIS element,
         so it must always equal the window — fixes the canvas filling only a corner. */
      #game-root {
        position: fixed;
        inset: 0;
        z-index: 0;
      }
      #game-root canvas {
        display: block;
      }
      #hud {
        position: fixed;
        top: 8px;
        left: 10px;
        z-index: 1;
        color: #cdbfe0;
        font-size: 13px;
        line-height: 1.5;
        pointer-events: none;
        text-shadow: 0 1px 2px #000;
      }
      #hud b {
        color: #4fd1c5;
      }
      .owner-note-overlay {
        position: fixed;
        inset: 0;
        z-index: 1000000;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: rgba(4, 6, 10, 0.72);
        pointer-events: auto;
      }
      .owner-note-bubble {
        width: min(760px, calc(100vw - 32px));
        box-sizing: border-box;
        padding: 24px;
        color: #e8edf2;
        background: linear-gradient(150deg, rgba(19, 28, 35, 0.99), rgba(9, 13, 18, 0.99));
        border: 2px solid #7ca6b8;
        border-radius: 18px 18px 18px 5px;
        box-shadow: 0 22px 80px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(206, 231, 239, 0.12);
      }
      .owner-note-kicker {
        color: #61d6cc;
        font: 700 12px/1.2 ui-monospace, SFMono-Regular, Consolas, monospace;
        letter-spacing: 0.16em;
      }
      .owner-note-bubble h2 {
        margin: 7px 0 5px;
        color: #f4e5bc;
        font: 800 24px/1.15 ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      .owner-note-context {
        margin-bottom: 14px;
        color: #b6cad4;
        font: 700 14px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
        overflow-wrap: anywhere;
      }
      .owner-note-bubble textarea {
        display: block;
        width: 100%;
        min-height: 190px;
        resize: vertical;
        box-sizing: border-box;
        padding: 14px 15px;
        color: #f2f5f7;
        caret-color: #61d6cc;
        background: #070b0f;
        border: 1px solid #486675;
        border-radius: 8px;
        outline: none;
        font: 15px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
      }
      .owner-note-bubble textarea:focus {
        border-color: #61d6cc;
        box-shadow: 0 0 0 3px rgba(97, 214, 204, 0.16);
      }
      .owner-note-error {
        min-height: 20px;
        padding-top: 4px;
        color: #ff9b7a;
        font-size: 13px;
      }
      .owner-note-bubble footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        color: #9fb1bb;
        font-size: 13px;
      }
      .owner-note-bubble footer > div {
        display: flex;
        gap: 8px;
        flex: none;
      }
      .owner-note-bubble kbd {
        color: #e9f4f6;
        font: inherit;
      }
      .owner-note-bubble button {
        padding: 8px 12px;
        color: #d9e4e8;
        background: #18232b;
        border: 1px solid #4a6572;
        border-radius: 6px;
        font: 700 13px/1 system-ui, sans-serif;
        cursor: pointer;
      }
      .owner-note-bubble button:hover,
      .owner-note-bubble button:focus-visible {
        border-color: #8bb6c6;
        outline: none;
      }
      .owner-note-bubble .owner-note-save {
        color: #071011;
        background: #61d6cc;
        border-color: #8bf3ea;
      }
      @media (max-width: 680px) {
        .owner-note-bubble {
          padding: 18px;
        }
        .owner-note-bubble footer {
          align-items: flex-start;
          flex-direction: column;
        }
      }
      #reconnect-overlay {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: flex-start;
        justify-content: center;
        box-sizing: border-box;
        padding: max(64px, 8vh) 16px 0;
        pointer-events: none;
      }
      #reconnect-overlay[hidden] {
        display: none;
      }
      #reconnect-overlay > div {
        max-width: min(620px, calc(100vw - 32px));
        padding: 9px 15px;
        color: #f4f7f8;
        background: rgba(8, 13, 18, 0.82);
        border: 1px solid #68c8ce;
        border-radius: 999px;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.38);
        font: 700 13px/1.35 ui-monospace, SFMono-Regular, Consolas, monospace;
        letter-spacing: 0.035em;
        text-align: center;
        text-shadow: 0 1px 2px #000;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      #reconnect-overlay[data-state="recovered"] > div {
        border-color: #7de08d;
      }
      #reconnect-overlay[data-state="ended"] > div {
        border-color: #ff8a6b;
      }
      #reconnect-abandon,
      #session-escape {
        padding: 7px 10px;
        color: #fff7e8;
        background: rgba(75, 35, 26, 0.96);
        border: 1px solid #ff9b72;
        border-radius: 999px;
        font: 800 12px/1 ui-monospace, SFMono-Regular, Consolas, monospace;
        letter-spacing: 0.02em;
        cursor: pointer;
        pointer-events: auto;
        white-space: nowrap;
      }
      #reconnect-abandon:hover,
      #reconnect-abandon:focus-visible,
      #session-escape:hover,
      #session-escape:focus-visible {
        background: #743c2e;
        border-color: #ffd0b8;
        outline: 2px solid rgba(255, 208, 184, 0.35);
        outline-offset: 2px;
      }
      #session-escape {
        position: fixed;
        right: 14px;
        bottom: 14px;
        z-index: 999998;
        color: #e8f8f7;
        background: rgba(10, 28, 32, 0.88);
        border-color: #68c8ce;
      }
      #session-escape[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="game-root"></div>
    <div id="hud">
      <div><b>Dimension Drifters</b></div>
      <div>WASD move · RMB fire · LMB parry · Space jump · E interact · Q cycle · H controls · <span id="status">connecting…</span></div>
      <div id="debug" style="color: #8a7aa0">loop: —</div>
    </div>
    <div id="reconnect-overlay" role="status" aria-live="polite" hidden>
      <div>
        <span id="reconnect-message"></span>
        <button id="reconnect-abandon" type="button">Abandon &amp; Start Fresh</button>
      </div>
    </div>
    <button id="session-escape" type="button" hidden>⌂ Exit to Lobby</button>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
