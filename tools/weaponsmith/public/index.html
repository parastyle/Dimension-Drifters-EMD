<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Dimension Drifters - Weaponsmith</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="header-title"><span class="eyebrow">Weapon production</span><h1>Weaponsmith</h1></div>
      <div class="header-selection"><span id="selectedHeader">Loading full catalog...</span><span id="dirtyState" class="dirty-state saved">Saved</span></div>
      <div class="header-actions"><span id="status" role="status" aria-live="polite"></span><button type="button" id="launchSelected" class="button secondary" disabled>Open in Testing Grounds</button><button type="button" id="save" class="button primary" disabled>Save weapon</button></div>
    </header>

    <aside class="library" aria-label="Weapon library">
      <div class="list-tools">
          <label class="search-field"><span>Search</span><input id="weaponSearch" type="search" autocomplete="off" placeholder="Name, ID, family..." aria-label="Search 339 active weapons" /></label>
        <div class="filter-grid" aria-label="Weapon filters">
          <label>Class<select id="classFilter" aria-label="Filter class"><option value="all">All</option></select></label>
          <label>Family<select id="familyFilter" aria-label="Filter family"><option value="all">All</option></select></label>
          <label>Delivery<select id="deliveryFilter" aria-label="Filter delivery"><option value="all">All</option></select></label>
          <label>Grip<select id="gripFilter" aria-label="Filter grip"><option value="all">All</option></select></label>
          <label>Element<select id="elementFilter" aria-label="Filter element"><option value="all">All</option></select></label>
          <label>Source<select id="sourceFilter" aria-label="Filter source"><option value="all">All</option></select></label>
          <label>Assignment<select id="assignmentFilter" aria-label="Filter assignment state"><option value="all">All</option><option value="bespoke-file">Bespoke</option><option value="generated-default">Generated</option><option value="none">None</option></select></label>
          <label>Art<select id="artFilter" aria-label="Filter art status"><option value="all">All</option><option value="ready">Ready</option><option value="rendering">Art rendering</option><option value="unavailable">Unavailable</option><option value="artless">Artless</option></select></label>
        </div>
        <div class="list-summary"><span id="listCount">Loading complete catalog...</span><button type="button" id="clearListFilters" class="text-button">Clear filters</button><button type="button" id="refreshList" class="text-button">Refresh</button></div>
      </div>
      <div id="listViewport" class="list-viewport" role="listbox" aria-label="Weapons" aria-setsize="339" tabindex="0"><div id="listSpacer" class="list-spacer"><div id="listWindow" class="list-window"></div></div></div>
      <footer class="list-command">Arrows navigate · Enter select · Z/X previous/next</footer>
    </aside>

    <main id="studio" class="studio"><div class="empty-state"><strong>Loading Weaponsmith</strong><span>Preparing the complete weapon catalog and two preview contexts.</span></div></main>
    <aside id="inspector" class="inspector" aria-label="Selected weapon inspector"><div class="empty-state"><strong>Selecting first weapon</strong><span>The workspace always opens with a valid selection.</span></div></aside>
  </div>
  <script src="/vfx-layers.js"></script>
  <script src="/phaser.min.js"></script>
  <script src="/vfx-render.js"></script>
  <script src="vfx-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
