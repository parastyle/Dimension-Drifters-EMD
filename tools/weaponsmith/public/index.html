<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>⚒ Weaponsmith — VFX</title>
<style>
  :root { --bg:#14110c; --panel:#1b1812; --panel2:#221e16; --line:#332d22; --ink:#e8e2d4;
    --dim:#9a9484; --gold:#ffd479; --rust:#a8482e; --green:#9cff3b; --floor:#2a2620; --grid:#342d22; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; }
  .app { display: grid; grid-template-columns: 220px 1fr; grid-template-rows: 48px 1fr; height: 100vh; }
  header { grid-column: 1 / 3; display: flex; align-items: center; gap: 14px; padding: 0 16px;
    border-bottom: 1px solid var(--line); background: #14110cf2; }
  header h1 { font-size: 15px; margin: 0; font-weight: 650; }
  header .sp { flex: 1; }
  #status { color: var(--dim); font-size: 12px; }
  aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  aside .wp { padding: 11px 14px; border-bottom: 1px solid #251f18; cursor: pointer; }
  aside .wp:hover { background: var(--panel2); }
  aside .wp.sel { background: #2b2519; border-left: 3px solid var(--gold); }
  aside .wp b { display: block; color: var(--ink); }
  aside .wp small { color: var(--dim); }
  aside .wp .dot { float: right; font-size: 11px; color: var(--green); }
  aside .grp { padding: 9px 14px 5px; font-size: 11px; text-transform: uppercase; letter-spacing: .7px;
    color: var(--gold); background: #100d09; border-bottom: 1px solid #251f18; position: sticky; top: 0; }
  main { overflow-y: auto; padding: 18px 22px; }
  .muted { color: var(--dim); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--gold);
    margin: 22px 0 10px; border-bottom: 1px solid var(--line); padding-bottom: 5px; }
  button { background: #2c2a22; color: #f0ead8; border: 1px solid #4a4636; border-radius: 6px;
    padding: 7px 13px; cursor: pointer; font-size: 13px; }
  button:hover { background: #3a382c; } button:disabled { opacity: .5; cursor: default; }
  button.primary { background: var(--rust); border-color: #c95a3a; color: #fff; }
  .cands { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .cand { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; cursor: pointer;
    border: 2px solid transparent; background:
      repeating-linear-gradient(0deg, transparent 0 23px, var(--grid) 23px 24px),
      repeating-linear-gradient(90deg, transparent 0 23px, var(--grid) 23px 24px), var(--floor); }
  .cand img { width: 100%; height: 100%; object-fit: contain; }
  .cand.sel { border-color: var(--gold); }
  .cand .tick { position: absolute; top: 4px; right: 6px; color: var(--gold); font-weight: 700; display: none; }
  .cand.sel .tick { display: block; }
  .reroll { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px; }
  textarea { width: 100%; background: #100d09; color: var(--ink); border: 1px solid var(--line);
    border-radius: 6px; padding: 9px; font: 12.5px/1.5 ui-monospace, monospace; resize: vertical; }
  .row { display: flex; gap: 12px; align-items: flex-start; }
  .row > * { min-width: 0; }
  .preview-wrap { display: grid; grid-template-columns: 300px 1fr; gap: 18px; }
  .stage { position: relative; width: 300px; height: 300px; border-radius: 10px; overflow: hidden;
    border: 1px solid var(--line); background:
      repeating-linear-gradient(0deg, transparent 0 47px, var(--grid) 47px 48px),
      repeating-linear-gradient(90deg, transparent 0 47px, var(--grid) 47px 48px),
      radial-gradient(circle at 50% 55%, #00000000 50%, #00000070 100%), var(--floor); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  select { background: #100d09; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 7px; font-size: 13px; }
  .params { margin-top: 12px; }
  .param { display: grid; grid-template-columns: 120px 1fr 48px; align-items: center; gap: 10px; margin: 7px 0; }
  .param label { color: var(--dim); } .param input { width: 100%; accent-color: var(--rust); }
  .param .val { color: var(--ink); text-align: right; font-variant-numeric: tabular-nums; }
  .stats { display: flex; gap: 16px; color: var(--dim); flex-wrap: wrap; }
  /* biome-ignore lint/style/noDescendingSpecificity: .stats b and `aside .wp b` style disjoint <b> elements (stats panel vs sidebar) — no real cascade overlap. */
  .stats b { color: var(--ink); }
  .empty { color: var(--dim); padding: 60px 0; text-align: center; }
  .spin { display: inline-block; width: 13px; height: 13px; border: 2px solid #ffffff44; border-top-color: var(--gold); border-radius: 50%; animation: sp 0.7s linear infinite; vertical-align: -2px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  pre.log { max-height: 120px; overflow: auto; background: #0c0a07; border: 1px solid var(--line); border-radius: 6px; padding: 8px; color: #8aa; font-size: 11px; white-space: pre-wrap; display: none; }
  /* §14 layer-suite checklist */
  .suite { display: flex; flex-direction: column; gap: 6px; max-height: 340px; overflow-y: auto; padding-right: 4px; }
  .layer { border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; background: #15120d; opacity: .6; }
  .layer.on { opacity: 1; border-color: #5a6048; background: #1b1812; }
  .layer .lhead { display: flex; align-items: center; gap: 7px; cursor: pointer; font-size: 13px; }
  .layer .lhead b { color: #e8e2d4; font-weight: 600; }
  .layer .trig { margin-left: auto; font-size: 10px; color: #7d7768; text-transform: uppercase; letter-spacing: .5px; border: 1px solid #332d22; border-radius: 10px; padding: 1px 7px; }
  .layer.on .trig { color: var(--gold); border-color: #4a4636; }
  .lparams { margin-top: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; }
  .lparam { display: grid; grid-template-columns: 70px 1fr 30px; align-items: center; gap: 6px; }
  .lparam label { color: var(--dim); font-size: 11px; }
  .lparam input { width: 100%; accent-color: var(--rust); }
  .lparam .val { color: var(--ink); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
  .rotrow { display: flex; align-items: center; gap: 7px; }
  .rotrow button { padding: 5px 9px; font-size: 12px; }
  .rotrow .rotval { min-width: 44px; text-align: center; color: var(--gold); font-variant-numeric: tabular-nums; font-weight: 650; }
  /* V2 — 4-up showcase: weapon · painted · engine · combined */
  .showcase { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 6px 0 4px; }
  .panel { border: 1px solid var(--line); border-radius: 9px; background: var(--panel); overflow: hidden; display: flex; flex-direction: column; }
  .panel .ptitle { display: flex; align-items: center; gap: 6px; padding: 6px 9px; font-size: 11px; text-transform: uppercase; letter-spacing: .5px; color: var(--gold); border-bottom: 1px solid var(--line); background: #15120d; }
  .panel .ptitle .sp { flex: 1; }
  .panel .ptitle button { padding: 2px 7px; font-size: 11px; }
  .panel .pbody { position: relative; aspect-ratio: 1; background:
      repeating-linear-gradient(0deg, transparent 0 31px, var(--grid) 31px 32px),
      repeating-linear-gradient(90deg, transparent 0 31px, var(--grid) 31px 32px),
      radial-gradient(circle at 50% 55%, #00000000 45%, #0008 100%), #0c0a07; }
  .panel .pbody img { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); object-fit: contain; }
  .panel .pbody .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 14px; color: var(--dim); font-size: 12px; }
  .panel .pedit { padding: 8px; border-top: 1px solid var(--line); background: #15120d; display: none; }
  .panel .pedit.open { display: block; }
  .panel .pedit textarea { min-height: 46px; font-size: 12px; }
  .panel .pedit .erow { display: flex; gap: 6px; margin-top: 6px; }
  /* authoring two-box */
  .author { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 6px; }
  .author .abox { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 11px; }
  .author .abox h3 { margin: 0 0 4px; font-size: 12px; color: var(--ink); }
  .author .abox .hint { color: var(--dim); font-size: 11px; margin-bottom: 7px; }
  .author .abox.disabled { opacity: .5; }
  .author textarea { min-height: 96px; }
  .abox .alabel { display: block; color: var(--dim); font-size: 11px; margin: 8px 0 4px; }
  .abox .alabel .muted { opacity: .8; }
  .abox button:not(.primary) { padding: 5px 10px; font-size: 12px; }
  .pending { color: var(--gold); font-size: 12px; }
  .adv { margin-top: 14px; border-top: 1px solid var(--line); padding-top: 10px; }
  .adv > summary { cursor: pointer; color: var(--dim); font-size: 12px; }
  /* V2.1 — reference strip (3 small panels) + a 2-col engine work area (preview beside controls) */
  .showcase3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 6px 0 4px; }
  .enginework { display: grid; grid-template-columns: minmax(300px, 1.05fr) 1fr; gap: 14px; margin-top: 12px; align-items: start; }
  .ework-left { position: sticky; top: 8px; }
  .ework-left .pbody { aspect-ratio: 1; }
  /* §14 VFX-origin picker — a click overlay + crosshair over the Combined preview */
  .originoverlay { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
  .originoverlay.active { pointer-events: auto; cursor: crosshair; box-shadow: inset 0 0 0 2px var(--gold); background: #ffd47914; }
  .originmark { position: absolute; z-index: 6; width: 16px; height: 16px; margin: -8px 0 0 -8px;
    pointer-events: none; display: none;
    background: radial-gradient(circle, var(--gold) 0 2px, transparent 3px);
    box-shadow: 0 0 0 1px #0008; }
  .originmark::before, .originmark::after { content: ""; position: absolute; background: var(--gold); }
  .originmark::before { left: 7px; top: 0; width: 2px; height: 16px; }
  .originmark::after { top: 7px; left: 0; height: 2px; width: 16px; }
  .ework-right .suite { max-height: 70vh; }
  .ework-right h2 { margin: 12px 0 6px; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>⚒ Weaponsmith <span class="muted">· VFX</span></h1>
    <div class="sp"></div>
    <span id="status"></span>
    <button type="button" id="save" class="primary">Save weapon</button>
  </header>
  <aside id="list"></aside>
  <main id="main"><div class="empty">Pick a weapon on the left to begin.</div></main>
</div>
<script src="/vfx-layers.js"></script>
<script src="/phaser.min.js"></script>
<script src="/vfx-render.js"></script>
<script src="vfx-engine.js"></script>
<script src="app.js"></script>
</body>
</html>
